<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 30 Wednesday & Thursday Practice Quiz</title>
    <style>
        /* --- CSS Variables & Themes --- */
        :root {
            /* Base Transition */
            --transition-speed: 0.3s;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* 1. Modern Dark (Default) */
        [data-theme="dark"] {
            --bg-body: #1e293b;
            --bg-card: #334155;
            --bg-header: #0f172a;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-accent: #38bdf8;
            --border-color: #475569;
            --highlight-bg: #475569;
            --button-bg: #38bdf8;
            --button-text: #0f172a;
            --button-hover: #0ea5e9;
            --feedback-success-bg: #064e3b;
            --feedback-success-border: #059669;
            --feedback-success-text: #a7f3d0;
            --feedback-error-bg: #7f1d1d;
            --feedback-error-border: #dc2626;
            --feedback-error-text: #fecaca;
        }

        /* 2. Modern Light */
        [data-theme="light"] {
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --bg-header: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --text-accent: #2563eb;
            --border-color: #e5e7eb;
            --highlight-bg: #f3f4f6;
            --button-bg: #2563eb;
            --button-text: #ffffff;
            --button-hover: #1d4ed8;
            --feedback-success-bg: #ecfdf5;
            --feedback-success-border: #34d399;
            --feedback-success-text: #065f46;
            --feedback-error-bg: #fef2f2;
            --feedback-error-border: #f87171;
            --feedback-error-text: #991b1b;
        }

        /* 3. Midnight (Pure Black) */
        [data-theme="midnight"] {
            --bg-body: #000000;
            --bg-card: #000000;
            --bg-header: #000000;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --text-accent: #90caf9;
            --border-color: #333333;
            --highlight-bg: #1a1a1a;
            --button-bg: #90caf9;
            --button-text: #000000;
            --button-hover: #42a5f5;
            --feedback-success-bg: #051b11;
            --feedback-success-border: #0f5132;
            --feedback-success-text: #75b798;
            --feedback-error-bg: #2c0b0e;
            --feedback-error-border: #842029;
            --feedback-error-text: #ea868f;
        }

        /* 4. Legacy Dark (Original) */
        [data-theme="legacy-dark"] {
            --bg-body: #2d343e;
            --bg-card: #3c424f;
            --bg-header: #3c424f;
            --text-main: #e8e6e3;
            --text-muted: #b0c4de;
            --text-accent: #8ab4f8;
            --border-color: #555;
            --highlight-bg: #454c5a;
            --button-bg: #8ab4f8;
            --button-text: #202124;
            --button-hover: #a3c5f9;
            --feedback-success-bg: #344e41;
            --feedback-success-border: #52b788;
            --feedback-success-text: #c7f9cc;
            --feedback-error-bg: #5e2129;
            --feedback-error-border: #a4133c;
            --feedback-error-text: #f8d7da;
        }

        /* 5. Sepia (Reading Mode) */
        [data-theme="sepia"] {
            --bg-body: #f4ecd8;
            --bg-card: #fdf6e3;
            --bg-header: #e4d5b7;
            --text-main: #433422;
            --text-muted: #7c6f5a;
            --text-accent: #a05a2c;
            --border-color: #d3c4a5;
            --highlight-bg: #ebe1c9;
            --button-bg: #a05a2c;
            --button-text: #fdf6e3;
            --button-hover: #864822;
            --feedback-success-bg: #e6f4ea;
            --feedback-success-border: #8ab893;
            --feedback-success-text: #2e4c35;
            --feedback-error-bg: #f9e3e3;
            --feedback-error-border: #d48f8f;
            --feedback-error-text: #5c2b2b;
        }

        /* 6. High Contrast */
        [data-theme="contrast"] {
            --bg-body: #000000;
            --bg-card: #000000;
            --bg-header: #000000;
            --text-main: #ffffff;
            --text-muted: #dddddd;
            --text-accent: #ffff00;
            --border-color: #ffffff;
            --highlight-bg: #333333;
            --button-bg: #ffff00;
            --button-text: #000000;
            --button-hover: #e6e600;
            --feedback-success-bg: #000000;
            --feedback-success-border: #00ff00;
            --feedback-success-text: #00ff00;
            --feedback-error-bg: #000000;
            --feedback-error-border: #ff0000;
            --feedback-error-text: #ff0000;
        }

        /* --- Global Reset & Layout --- */
        * { box-sizing: border-box; }
        
        body {
            font-family: var(--font-main);
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            line-height: 1.6;
        }

        /* --- Header --- */
        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* Default to Sticky */
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        /* Class to remove sticky behavior */
        header.unpinned {
            position: relative;
            box-shadow: none;
        }

        header h1 {
            font-size: 1.25rem;
            margin: 0;
            color: var(--text-accent);
        }

        .controls-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .pin-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        .pin-btn:hover {
            background-color: var(--highlight-bg);
        }

        .pin-btn.pin-active {
            color: var(--text-accent);
            border-color: var(--text-accent);
            background-color: rgba(0, 0, 0, 0.1);
        }

        .theme-control {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        select#theme-select {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            color: var(--text-main);
            cursor: pointer;
            font-family: inherit;
        }

        /* --- Main Content --- */
        .container {
            max-width: 850px;
            margin: 2rem auto;
            padding: 0 1rem 4rem 1rem;
        }

        .section-header {
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--text-accent);
            color: var(--text-accent);
            font-size: 1.5rem;
            font-weight: 700;
        }

        /* --- Question Card --- */
        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .lo-box {
            background-color: var(--highlight-bg);
            border-left: 4px solid var(--text-accent);
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        /* --- Options --- */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background-color: var(--highlight-bg);
            border-color: var(--text-muted);
        }

        .option-label input {
            margin-top: 0.3rem;
            margin-right: 1rem;
            accent-color: var(--text-accent);
            transform: scale(1.2);
        }

        /* --- Tables --- */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            font-size: 0.9rem;
        }
        
        th, td {
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            text-align: left;
        }

        th {
            background-color: var(--highlight-bg);
            font-weight: 600;
        }

        /* --- Buttons --- */
        .btn-check {
            margin-top: 1.5rem;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-check:hover {
            opacity: 0.9;
        }

        /* --- Feedback Area --- */
        .feedback {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 8px;
            display: none; /* Hidden by default */
            border: 1px solid transparent;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background-color: var(--feedback-success-bg);
            border-color: var(--feedback-success-border);
            color: var(--feedback-success-text);
        }

        .feedback.incorrect {
            background-color: var(--feedback-error-bg);
            border-color: var(--feedback-error-border);
            color: var(--feedback-error-text);
        }

        .feedback-header {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .rationale {
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .source {
            display: block;
            margin-top: 1rem;
            font-size: 0.85rem;
            opacity: 0.8;
            font-style: italic;
            border-top: 1px dashed currentColor;
            padding-top: 0.5rem;
        }

        /* --- Mobile Tweaks --- */
        @media (max-width: 600px) {
            header { padding: 1rem; flex-direction: column; gap: 10px; align-items: flex-start; }
            .controls-wrapper { width: 100%; justify-content: space-between; }
            .question-card { padding: 1.5rem; }
            header h1 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <header id="main-header">
        <h1>Week 30 Wednesday & Thursday Practice Quiz</h1>
        <div class="controls-wrapper">
            <!-- Pin Button -->
            <button class="pin-btn pin-active" id="pin-btn" onclick="toggleHeader()" title="Pin/Unpin Header">
                📍
            </button>
            
            <div class="theme-control">
                <label for="theme-select">Theme:</label>
                <select id="theme-select" onchange="changeTheme(this.value)">
                    <option value="dark">Modern Dark</option>
                    <option value="midnight">Midnight</option>
                    <option value="light">Modern Light</option>
                    <option value="legacy-dark">Legacy Dark</option>
                    <option value="sepia">Sepia</option>
                    <option value="contrast">High Contrast</option>
                </select>
            </div>
        </div>
    </header>

    <div class="container" id="quiz-root">
        <!-- Content injected via JS -->
    </div>

    <script>
        // --- Data ---
        const quizData = [
            // --- Section 1: PFTs, ABGs, and Diagnosing Gas Exchange ---
            {
                section: "PFTs, ABGs, and Diagnosing Gas Exchange",
                maskedLO: "LO1: Interpret Pulmonary Function Tests (PFT’s)",
                fullLO: "LO1: Interpret Pulmonary Function Tests (PFT’s)",
                question: "A 45-year-old male presents with chronic dyspnea. Pulmonary function testing (PFT) reveals an FEV1/FVC ratio of 0.60 and an FEV1 of 65% predicted. Following the administration of a bronchodilator, the FEV1 increases by 5% (100 mL). Which of the following is the most accurate interpretation of these findings?",
                options: {
                    A: "Normal pulmonary function",
                    B: "Obstructive defect that is not fully reversible",
                    C: "Obstructive defect with significant reversibility",
                    D: "Restrictive defect",
                    E: "Upper airway obstruction"
                },
                correctAnswer: "B",
                rationale: "An FEV1/FVC ratio < 0.7 indicates an obstructive defect. A positive bronchodilator response requires a 12% AND 0.2 L increase in FEV1 or FVC. This patient showed only a 5% increase, indicating the obstruction is not fully reversible (characteristic of COPD).",
                source: "PFT_ABG_and_Gas_Exchange_PDF.pdf, Slides 9 & 18: \"Patient has obstructive defect: FEV-1/FVC < 0.7... Look for a positive bronchodilator response: 12% and 0.2 L increase in either FEV1 or FVC\""
            },
            {
                section: "PFTs, ABGs, and Diagnosing Gas Exchange",
                maskedLO: "LO1: Interpret Pulmonary Function Tests (PFT’s)",
                fullLO: "LO1: Interpret Pulmonary Function Tests (PFT’s)",
                question: "A 60-year-old female undergoes spirometry. The flow-volume loop demonstrates a \"scooped out\" appearance on the expiratory limb. The FEV1/FVC ratio is 0.55. Which of the following is most consistent with this spirogram pattern?",
                options: {
                    A: "Normal function",
                    B: "Restrictive lung disease (e.g. kyphoscoliosis)",
                    C: "Lower airway obstruction (e.g. laryngeal edema)",
                    D: "Obstructive lung disease (e.g. pulmonary emphysema)",
                    E: "Fixed major airway obstruction (e.g. vocal cord dysfunction)"
                },
                correctAnswer: "D",
                rationale: "A \"scooped out\" expiratory limb on a flow-volume loop is characteristic of obstructive disease, such as emphysema.",
                source: "PFT_ABG_and_Gas_Exchange_PDF.pdf, Slide 13: \"Obstructive (e.g. asthma) ... Severe obstructive disease (e.g. emphysema) before (shaded curve)...\" [Image showing scooped out curve for B and C]"
            },
            {
                section: "PFTs, ABGs, and Diagnosing Gas Exchange",
                maskedLO: "LO2: Contrast obstruction and restriction",
                fullLO: "LO2: Contrast obstruction and restriction",
                question: "A 55-year-old male presents with progressive shortness of breath. Pulmonary function testing reveals a normal FEV1/FVC ratio (0.85) but a reduced Total Lung Capacity (TLC) and reduced Forced Vital Capacity (FVC). The flow-volume loop appears narrow but tall (\"witch's hat\" appearance). These findings are most consistent with:",
                options: {
                    A: "Asthma",
                    B: "Chronic bronchitis",
                    C: "Emphysema",
                    D: "Pulmonary fibrosis",
                    E: "Tracheal stenosis"
                },
                correctAnswer: "D",
                rationale: "Restrictive defects are characterized by a normal FEV1/FVC ratio (>0.7), decreased FVC, and decreased lung volumes (TLC). This pattern is seen in interstitial diseases like pulmonary fibrosis.",
                source: "PFT_ABG_and_Gas_Exchange_PDF.pdf, Slide 9: \"Patient has restrictive defect... FEV-1/FVC > 0.7 ... decreased FVC and decreased lung volumes\""
            },
            {
                section: "PFTs, ABGs, and Diagnosing Gas Exchange",
                maskedLO: "LO2: Contrast obstruction and restriction",
                fullLO: "LO2: Contrast obstruction and restriction",
                question: "A medical student is reviewing flow-volume loops. One loop shows a flattening of both the inspiratory and expiratory limbs, creating a box-like shape. This pattern suggests a fixed obstruction located in which anatomical region?",
                options: {
                    A: "Alveoli",
                    B: "Bronchioles",
                    C: "Major airway (e.g., trachea/larynx)",
                    D: "Peripheral airways",
                    E: "Pleural space"
                },
                correctAnswer: "C",
                rationale: "A fixed major airway obstruction (e.g., laryngeal obstruction or tracheal stenosis) results in flattening of both inspiratory and expiratory loops.",
                source: "PFT_ABG_and_Gas_Exchange_PDF.pdf, Slides 13 & 15: \"Fixed major airway obstruction (e.g. laryngeal obstruction)... Fixed upper airway obstruction... Tracheal stenosis\""
            },
            {
                section: "PFTs, ABGs, and Diagnosing Gas Exchange",
                maskedLO: "LO3: Discuss ventilation, oxygenation, hypoxemia, hypoxia and FiO2",
                fullLO: "LO3: Discuss ventilation, oxygenation, hypoxemia, hypoxia and FiO2",
                question: "A 30-year-old male is brought to the emergency department with suspected carbon monoxide poisoning. He has a normal PaO2 on arterial blood gas but signs of tissue hypoxia. This type of hypoxia is best classified as:",
                options: {
                    A: "Anemic hypoxia",
                    B: "Circulatory hypoxia",
                    C: "Histologic hypoxia",
                    D: "Hypoxic hypoxia",
                    E: "Stagnant hypoxia"
                },
                correctAnswer: "A",
                rationale: "Anemic hypoxia is present when hemoglobin concentration is lower than normal or unable to transport O2, such as in carbon monoxide poisoning.",
                source: "PFT_ABG_and_Gas_Exchange_PDF.pdf, Slide 30: \"Anemic hypoxia is present when Hb concentration is lower than normal or unable to transport O2 – sickle cell, CO poisoning, and metHb\""
            },
            {
                section: "PFTs, ABGs, and Diagnosing Gas Exchange",
                maskedLO: "LO3: Discuss ventilation, oxygenation, hypoxemia, hypoxia and FiO2",
                fullLO: "LO3: Discuss ventilation, oxygenation, hypoxemia, hypoxia and FiO2",
                question: "A patient is placed on a 50% oxygen mask. What is the fraction of inspired oxygen (FiO2) for this patient?",
                options: {
                    A: "0.21",
                    B: "0.28",
                    C: "0.40",
                    D: "0.50",
                    E: "1.00"
                },
                correctAnswer: "D",
                rationale: "FiO2 is the fraction or percentage of oxygen in the air. 50% oxygen corresponds to an FiO2 of 0.5.",
                source: "PFT_ABG_and_Gas_Exchange_PDF.pdf, Slide 31: \"If we place a patient on 50% oxygen mask, his FiO2 is 0.5\""
            },
            {
                section: "PFTs, ABGs, and Diagnosing Gas Exchange",
                maskedLO: "LO4: Interpret arterial blood gas results",
                fullLO: "LO4: Interpret arterial blood gas results",
                question: "A 22-year-old female presents with anxiety and tachypnea. An arterial blood gas (ABG) is obtained on room air. The results are pH 7.52, pCO2 28 mmHg, pO2 105 mmHg, HCO3 24 mEq/L. These results indicate:",
                options: {
                    A: "Metabolic acidosis",
                    B: "Metabolic alkalosis",
                    C: "Normal acid-base status",
                    D: "Respiratory acidosis",
                    E: "Respiratory alkalosis"
                },
                correctAnswer: "E",
                rationale: "The pH is alkalotic (>7.45) and the pCO2 is low (<35 mmHg), indicating respiratory alkalosis due to hyperventilation.",
                source: "PFT_ABG_and_Gas_Exchange_PDF.pdf, Slide 26: \"Hyperventilation is pCO2 < 35\""
            },
            {
                section: "PFTs, ABGs, and Diagnosing Gas Exchange",
                maskedLO: "LO4: Interpret arterial blood gas results",
                fullLO: "LO4: Interpret arterial blood gas results",
                question: "A 60-year-old male with a history of severe COPD presents with drowsiness. His ABG reveals pH 7.25, pCO2 65 mmHg, pO2 50 mmHg, HCO3 28 mEq/L. The elevated pCO2 indicates:",
                options: {
                    A: "Adequate ventilation",
                    B: "Hyperventilation",
                    C: "Hypoventilation",
                    D: "Increased diffusion capacity",
                    E: "Metabolic compensation"
                },
                correctAnswer: "C",
                rationale: "pCO2 is a measure of the adequacy of ventilation. A pCO2 > 45 mmHg defines hypoventilation.",
                source: "PFT_ABG_and_Gas_Exchange_PDF.pdf, Slide 26: \"Hypoventilation is pCO2 > 45\""
            },
            {
                section: "PFTs, ABGs, and Diagnosing Gas Exchange",
                maskedLO: "LO5: Interpret oximetry results",
                fullLO: "LO5: Interpret oximetry results",
                question: "A patient undergoes a 6-minute walk test. At rest, the pulse oximetry shows an O2 saturation of 97%. During exercise, the saturation drops to 88%. This finding is indicative of:",
                options: {
                    A: "Improved gas exchange with exercise",
                    B: "Normal physiologic response to exercise",
                    C: "Abnormal desaturation with exercise",
                    D: "Technical error in the oximeter",
                    E: "Hyperventilation"
                },
                correctAnswer: "C",
                rationale: "Normal resting O2 saturation is 96-97%, and it should not fall with exercise. A drop indicates an abnormality.",
                source: "PFT_ABG_and_Gas_Exchange_PDF.pdf, Slide 46: \"Normal resting O2 sat is 96-97%... O2 sat should not fall with exercise\""
            },
            {
                section: "PFTs, ABGs, and Diagnosing Gas Exchange",
                maskedLO: "LO5: Interpret oximetry results",
                fullLO: "LO5: Interpret oximetry results",
                question: "A patient has a resting O2 saturation of 97% measured by pulse oximetry. This value is considered:",
                options: {
                    A: "Critical hypoxemia",
                    B: "Mildly low",
                    C: "Normal",
                    D: "Supranormal",
                    E: "Unreliable"
                },
                correctAnswer: "C",
                rationale: "The lecture states that a normal resting O2 saturation is 96-97%.",
                source: "PFT_ABG_and_Gas_Exchange_PDF.pdf, Slide 46: \"Normal resting O2 sat is 96-97%\""
            },
            {
                section: "PFTs, ABGs, and Diagnosing Gas Exchange",
                maskedLO: "LO6: Given arterial blood gas results, determine a possible diagnosis.",
                fullLO: "LO6: Given arterial blood gas results, determine a possible diagnosis.",
                question: "A 40-year-old alcoholic is brought to the ER with fever and chills. A chest X-ray confirms pneumonia. His ABG on room air shows: pH 7.45, PaO2 42, PaCO2 34. After being placed on 100% oxygen, his PaO2 only rises to 56. What is the primary mechanism of his hypoxemia?",
                options: {
                    A: "Anemia",
                    B: "Diffusion defect",
                    C: "Hypoventilation",
                    D: "Shunt",
                    E: "V/Q Mismatch"
                },
                correctAnswer: "D",
                rationale: "The patient has severe hypoxemia that does not correct significantly with 100% oxygen. This lack of response to 100% oxygen is characteristic of a shunt (e.g., alveoli filled with fluid in pneumonia).",
                source: "PFT_ABG_and_Gas_Exchange_PDF.pdf, Slide 55 & 56 diagram: \"40-Year-Old Alcoholic... 100% O2 56... What is his problem? A. Shunt\""
            },
            {
                section: "PFTs, ABGs, and Diagnosing Gas Exchange",
                maskedLO: "LO6: Given arterial blood gas results, determine a possible diagnosis.",
                fullLO: "LO6: Given arterial blood gas results, determine a possible diagnosis.",
                question: "A 56-year-old man is found somnolent in the recovery room. His ABG on room air reveals: pH 7.14, PCO2 85 mmHg, PO2 35 mmHg, and a normal A-a gradient (Calculated A-a DO2 = 9 mmHg). What is the primary cause of his hypoxemia?",
                options: {
                    A: "Anemia",
                    B: "Diffusion defect",
                    C: "Hypoventilation",
                    D: "Shunt",
                    E: "V/Q Mismatch"
                },
                correctAnswer: "C",
                rationale: "The patient has a very high PCO2 (85 mmHg), respiratory acidosis (pH 7.14), and a normal A-a gradient. Hypoxemia with a normal A-a gradient and hypercapnia indicates hypoventilation.",
                source: "PFT_ABG_and_Gas_Exchange_PDF.pdf, Slide 57: \"56-year-old man found to be somnolent... pH 7.14, PCO2 85... A-a DO2 9... Problem? A. Hypoventilation\""
            },

            // --- Section 2: Clinical Approach to COPD ---
            {
                section: "Clinical Approach to COPD",
                maskedLO: "LO1: Recognize the clinical symptoms and signs of COPD",
                fullLO: "LO1: Recognize the clinical symptoms and signs of COPD",
                question: "A 65-year-old male smoker presents for evaluation. Physical examination reveals a barrel chest, use of accessory muscles for respiration, and pursed-lip breathing. Percussion of the chest demonstrates hyperresonance. These findings are most consistent with:",
                options: {
                    A: "Congestive Heart Failure",
                    B: "COPD",
                    C: "Lung Cancer",
                    D: "Pleural Effusion",
                    E: "Pulmonary Fibrosis"
                },

        // --- Core Logic ---
        const quizRoot = document.getElementById('quiz-root');
        const themeSelect = document.getElementById('theme-select');
        const pinBtn = document.getElementById('pin-btn');
        const mainHeader = document.getElementById('main-header');

        function initQuiz() {
            // Render Questions
            let currentSection = "";
            let questionCount = 0;
            
            quizData.forEach((item, index) => {
                // Insert Section Header if needed
                if (item.section !== currentSection) {
                    currentSection = item.section;
                    const sectionHeader = document.createElement('h2');
                    sectionHeader.className = 'section-header';
                    sectionHeader.textContent = currentSection;
                    quizRoot.appendChild(sectionHeader);
                }

                questionCount++;

                // Create Card
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                // Learning Objective (Masked)
                const loBox = document.createElement('div');
                loBox.className = 'lo-box';
                loBox.id = `lo-${index}`;
                loBox.textContent = item.maskedLO;
                card.appendChild(loBox);

                // Question Text
                const qText = document.createElement('div');
                qText.className = 'question-text';
                
                // Add question text and optional table
                // Check if the question text already has HTML (e.g. table), if so, insert directly
                if (item.question.includes('<table')) {
                    qText.innerHTML = `${questionCount}. ${item.question}`;
                } else {
                    qText.textContent = `${questionCount}. ${item.question}`;
                }
                
                card.appendChild(qText);

                // Options Container
                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                for (const [key, value] of Object.entries(item.options)) {
                    const label = document.createElement('label');
                    label.className = 'option-label';
                    
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question-${index}`;
                    input.value = key;

                    const span = document.createElement('span');
                    span.textContent = `${key}. ${value}`;

                    label.appendChild(input);
                    label.appendChild(span);
                    optionsGrid.appendChild(label);
                }
                card.appendChild(optionsGrid);

                // Check Button
                const btn = document.createElement('button');
                btn.className = 'btn-check';
                btn.textContent = 'Check Answer';
                btn.onclick = () => checkAnswer(index);
                card.appendChild(btn);

                // Feedback Container
                const feedback = document.createElement('div');
                feedback.className = 'feedback';
                feedback.id = `feedback-${index}`;
                card.appendChild(feedback);

                quizRoot.appendChild(card);
            });

            // Load saved theme
            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            changeTheme(savedTheme);
            themeSelect.value = savedTheme;

            // Load saved pin state
            const savedPinState = localStorage.getItem('headerPinned');
            // Default to true (pinned) if not set or if set to true
            if (savedPinState === 'false') {
                toggleHeader(false); 
            } else {
                toggleHeader(true);
            }
        }

        function checkAnswer(index) {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            const feedbackEl = document.getElementById(`feedback-${index}`);
            const loEl = document.getElementById(`lo-${index}`);
            const data = quizData[index];

            if (!selected) {
                alert("Please select an answer.");
                return;
            }

            // Reveal LO
            loEl.textContent = data.fullLO;

            // Generate Feedback HTML
            const isCorrect = selected.value === data.correctAnswer;
            
            let html = `<span class="feedback-header">${isCorrect ? "Correct!" : "Incorrect"}</span>`;
            if (!isCorrect) {
                html += `<div>The correct answer is <strong>${data.correctAnswer}</strong>.</div>`;
            }
            
            html += `<div class="rationale"><strong>Rationale:</strong> ${data.rationale}</div>`;
            html += `<div class="source"><strong>Source:</strong> ${data.source}</div>`;

            feedbackEl.innerHTML = html;
            feedbackEl.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedbackEl.style.display = 'block';
        }

        function changeTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('quizTheme', themeName);
        }

        function toggleHeader(forceState) {
            // Determine current state based on class presence
            const isCurrentlyPinned = !mainHeader.classList.contains('unpinned');
            
            // If forceState is provided (boolean), use it. Otherwise toggle current state.
            const newState = (typeof forceState === 'boolean') ? forceState : !isCurrentlyPinned;

            if (newState) {
                // Pin
                mainHeader.classList.remove('unpinned');
                pinBtn.classList.add('pin-active');
                localStorage.setItem('headerPinned', 'true');
            } else {
                // Unpin
                mainHeader.classList.add('unpinned');
                pinBtn.classList.remove('pin-active');
                localStorage.setItem('headerPinned', 'false');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', initQuiz);

    </script>
